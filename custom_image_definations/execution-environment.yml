---
version: 3

images:
  base_image:
    name: registry.redhat.io/ansible-automation-platform-26/ee-minimal-rhel9:latest

dependencies:
  # --- FIX APPLIED HERE ---
  python_interpreter:
    package_system: python312
    python_path: /usr/bin/python3.12

  galaxy:
    collections:
      # --- Cloud Infrastructure ---
      - name: amazon.aws
      - name: azure.azcollection
      - name: google.cloud
      - name: community.vmware

      # --- Operating Systems & Linux Core ---
      - name: ansible.posix
      - name: community.general
      - name: community.crypto
      - name: microsoft.ad

      # --- Networking & Security ---
      - name: cisco.ios
      - name: arista.eos
      - name: vyos.vyos

      # --- Modern Data Tools ---
      - name: kubernetes.core
      - name: community.docker

  python:
    - boto3
    - botocore
    - azure-cli-core
    - google-auth
    - pyVmomi
    - hvac               
    - cryptography
    - openshift          
    - pywinrm[credssp]   

  system:
    - git
    - tar
    - unzip
    - sshpass            

  exclude:
    system:
      - openshift-clients

options:
  package_manager_path: /usr/bin/microdnf
